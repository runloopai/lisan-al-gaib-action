name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - uses: runloopai/checkout@main
      - uses: runloopai/pnpm-action@master
        with:
          version: ^10.16
      - uses: runloopai/setup-node@main
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type Check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Check dist is up to date
        run: |
          if git status --porcelain dist/ cli-dist/ | grep -q .; then
            echo "::error::dist/ or cli-dist/ is out of date. Run 'pnpm build' and commit."
            git status --short dist/ cli-dist/
            exit 1
          fi
      - name: Verify dist/ does not contain TUI deps
        run: |
          # Grep for @clack (scoped package name — reliably present in bundles that include it).
          # The '"cac"' literal was brittle: ncc can inline the module without that exact token.
          if grep -q "@clack" dist/index.js; then
            echo "ERROR: dist/index.js (action bundle) contains TUI dependency (clack)"
            exit 1
          fi
          # Symmetric guard: cli-dist/ MUST contain @clack.
          # A future tree-shake that accidentally removes the TUI from the update bin should be caught.
          if ! grep -q "@clack" cli-dist/index.js; then
            echo "ERROR: cli-dist/index.js (update CLI bundle) is missing TUI dependency (clack)"
            exit 1
          fi

